  </defs>

  <line x1="50" y1="22" x2="50" y2="134" stroke="currentColor" stroke-width="16" stroke-linecap="round"/>
  <path d="M 28 36 L 50 16 L 72 36" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="42" y="60" width="16" height="8" fill="url(#shaftFade)"/>

  <rect x="14" y="68" width="72" height="277" rx="14" fill="url(#body)"/>
  <rect x="14" y="68" width="72" height="277" rx="14" fill="url(#bodyVert)"/>

  <g clip-path="url(#bodyClip)">
    <rect x="14" y="68" width="72" height="36" fill="url(#ferrule)"/>
    <rect x="14" y="68" width="72" height="2" fill="#fff" opacity="0.22"/>
    <rect x="14" y="102" width="72" height="2" fill="#000" opacity="0.40"/>
