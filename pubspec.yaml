name: ux
description: >-
  Flutter toolkit for fluid, native-feeling UIs. Includes frame-accurate
  keyboard height tracking via FFI with interactive dismiss, bezier utilities,
  and layout primitives.
version: 0.17.0
homepage: https://swipelab.co/ux.html
repository: https://github.com/swipelab/ux
issue_tracker: https://github.com/swipelab/ux/issues
topics:
  - keyboard
  - ui
  - animation

publish_to: none

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  matcher: ^0.12.16
  build: '>=2.4.0 <5.0.0'
  clock: ^1.1.1
  collection: ^1.18.0
  path: ^1.9.0
  path_provider: ^2.1.5
  swipelab_webp:
    path: ../swipelab_webp
  flutter_svg: ^2.0.10
  vector_math: ^2.1.4
  ffi: ^2.1.0
  # Pure-Dart AES used by the software fallback path of XCrypto.aesCtrEncryptRange
  # (when no native hardware-AES handler ships — web / linux / windows / tests).
  pointycastle: ^4.0.0

dev_dependencies:
  cupertino_icons: ^1.0.8
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: XPlugin
        sharedDarwinSource: true
      android:
        package: io.swipelab.ux
        pluginClass: XPlugin
      macos:
        pluginClass: XPlugin
        sharedDarwinSource: true
  assets:
    # LGPL-2.1 text for the bundled FFmpeg software H.264 decoder
    # (libffmpegJNI.so, Android only). Surfaced via registerFfmpegLicense().
    - assets/licenses/ffmpeg_LGPL-2.1.txt
    - assets/draw_tools/
