name: ux_example
description: Demonstrates how to use the ux plugin.
publish_to: 'none'

environment:
  sdk: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.8
  flutter_webrtc: 1.6.0
  ux:
    path: ../

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - integration_test/assets/
